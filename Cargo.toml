[workspace]
members = ["crates/catalog", "crates/sandbox"]
resolver = "2"

[profile.dev]
debug = 0
incremental = false

# Bevy recommends optimized dependencies even during development. Physics,
# texture decoding and asset upload otherwise execute unoptimized hot loops.
[profile.dev.package."*"]
opt-level = 3

# Keep application math optimized without requiring release builds.
[profile.dev.package.rust-sandbox]
opt-level = 2

[profile.test]
debug = 0
incremental = false
