[package]
name = "rust-sandbox"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "rust-sandbox"

[dependencies]
sandbox-catalog = { path = "../catalog" }
bevy = { version = "0.16.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_window", "bevy_winit", "bevy_text", "bevy_ui", "bevy_gizmos", "bevy_audio", "wav", "mp3", "default_font", "png"] }
bevy_rapier3d = { version = "0.30.0", default-features = false, features = ["dim3"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
csv = "1.3"
vbsp = "0.9.1"
vtf = "0.4.1"
vmt-parser = "0.2.1"
vpk = "0.3.0"
vmdl = "0.2.0"
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[build-dependencies]
sandbox-catalog = { path = "../catalog" }
