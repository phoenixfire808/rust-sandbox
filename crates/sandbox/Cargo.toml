[package]
name = "rust-sandbox"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "rust-sandbox"

[dependencies]
sandbox-catalog = { path = "../catalog" }
bevy = { version = "0.16.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_window", "bevy_winit", "bevy_text", "bevy_ui", "bevy_gizmos", "default_font", "png"] }
bevy_rapier3d = { version = "0.30.0", default-features = false, features = ["dim3"] }
serde_json = "1"
vbsp = "0.9.1"
vtf = "0.4.1"
vmt-parser = "0.2.1"
vpk = "0.3.0"
vmdl = "0.2.0"
image = { version = "0.25", default-features = false }

[build-dependencies]
sandbox-catalog = { path = "../catalog" }
